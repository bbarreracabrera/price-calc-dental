<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFAF8" />
    <meta name="description" content="Software clínico dental para consultas y clínicas en Chile" />

    <title>ShiningCloud | Dental</title>

    <link rel="icon" type="image/svg+xml" href="/dental-icon.svg" />
    <link rel="apple-touch-icon" href="/dental-icon.svg" />

    <!--
      La app no cargaba ninguna tipografía: ni <link> ni @font-face ni
      fontFamily en Tailwind. Cada equipo renderizaba con su sans por defecto,
      y esa es la segunda causa de que la app se viera poco definida.
      Plus Jakarta Sans es la del brandbook. `display=swap` evita el texto
      invisible mientras carga.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
